apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
  namespace: pulse
data:
  DATA_SOURCE: "demo"
  DB_DRIVER: "postgres"
  PORT: "3000"
  APP_URL: "http://localhost:3000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-postgres-data
  namespace: pulse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: pulse
            - name: POSTGRES_DB
              value: pulse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
          args:
            - postgres
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=30
            - -c
            - work_mem=4MB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - pulse
                - -d
                - pulse
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: pulse-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pulse
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      containers:
        - name: pulse
          image: pulse:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: pulse-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: POSTGRES_PASSWORD
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: BETTER_AUTH_SECRET
            - name: DATABASE_URL
              value: "postgres://pulse:$(POSTGRES_PASSWORD)@postgres:5432/pulse"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pulse
  namespace: pulse
spec:
  selector:
    app: pulse
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
